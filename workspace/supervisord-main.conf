[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8080 --auth none --disable-telemetry --disable-update-check --extensions-dir /opt/code-server/extensions /workspace
environment=HOME="/home/node"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:express-build]
directory=/workspace/build/server
command=/opt/modules/build/server/node_modules/.bin/nodemon app.js
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vite-build]
directory=/workspace/build/client
command=/opt/modules/build/client/node_modules/.bin/vite
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vite-style]
directory=/workspace/style/client
command=/opt/modules/style/client/node_modules/.bin/vite
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The finished API for module style (Tailwind), with its own database. Code is read-only (/course).
[program:reference-style]
command=node /course/reference-api/server.js
environment=NODE_PATH="/opt/modules/build/server/node_modules",PORT="3002",DB_HOST="db",DB_NAME="taskapp_style",DB_USER="app",DB_PASSWORD="app_pw"
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
