[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8080 --auth none --disable-telemetry --disable-update-check --extensions-dir /opt/code-server/extensions /workspace
environment=HOME="/home/node"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The finished API that the Robot tests target. The code is read-only (/course).
[program:reference-api]
command=node /course/reference-api/server.js
environment=PORT="3001",DB_HOST="db",DB_NAME="taskapp_test",DB_USER="robot",DB_PASSWORD="robot_pw"
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Serves the Robot report (report.html, log.html) written by `robot --outputdir results`.
[program:report-server]
command=python3 -m http.server 9323 --bind 0.0.0.0 --directory /workspace/api/results
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
