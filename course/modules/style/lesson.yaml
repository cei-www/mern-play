# Module "style": restyle the Task Manager page with Tailwind CSS.
# Runs in ws-main on :5174. The learner's project is /workspace/style/client (React + Vite, Tailwind installed but not wired);
# its API is the finished reference API on :3002 (database taskapp_style).
# The finished project is course/solution/style. Its zones (s<part>-<step>-<name>) are the places a step fills in,
# and the starting project (workspace/project-template/style) is generated from it with every zone emptied.
id: style
title: Tailwind CSS
order: 2
minutes: 180
container: ws-main
defaultTab: editor
optional: false
parts:
  - id: part-a
    title: "Part A: Wire it up"
    steps:
      - { id: "1.1", title: What Tailwind is, type: read, file: part-a/1.1-what-is-tailwind.html }
      - { id: "1.2", title: Add the Tailwind plugin to Vite, type: do, file: part-a/1.2-vite-plugin.html, checks: [vite-wired] }
      - { id: "1.3", title: Import Tailwind in your CSS, type: do, file: part-a/1.3-css-import.html, checks: [css-imported] }
      - { id: "1.4", title: Your first classes, type: do, file: part-a/1.4-first-classes.html, checks: [title-classes, title-build] }
      - { id: "1.5", title: See what a class does, type: do, file: part-a/1.5-devtools.html }
  - id: part-b
    title: "Part B: Layout and spacing"
    steps:
      - { id: "2.1", title: Padding, margin and gap, type: do, file: part-b/2.1-spacing.html, checks: [spacing-app, spacing-row, spacing-form] }
      - { id: "2.2", title: "Flex: header and rows", type: do, file: part-b/2.2-flex.html, checks: [flex-app, flex-row, flex-form, flex-groups, flex-sort] }
      - { id: "2.3", title: "Grid: groups and list", type: do, file: part-b/2.3-grid.html, checks: [grid-layout] }
      - { id: "2.4", title: Container, maximum width, centering, type: do, file: part-b/2.4-container.html, checks: [container] }
  - id: part-c
    title: "Part C: Look and feel"
    steps:
      - { id: "3.1", title: Typography, type: do, file: part-c/3.1-typography.html, checks: [type-title, type-row] }
      - { id: "3.2", title: Cards and surfaces, type: do, file: part-c/3.2-surfaces.html, checks: [surface-app, surface-row, surface-history] }
      - { id: "3.3", title: Buttons and fields, type: do, file: part-c/3.3-buttons.html, checks: [buttons-tab, buttons-group, buttons-input] }
      - { id: "3.4", title: Your own theme, type: do, file: part-c/3.4-theme.html, checks: [theme-css, theme-title] }
      - { id: "3.5", title: Badges, type: do, file: part-c/3.5-badges.html, checks: [badge-group, badge-priority] }
  - id: checkpoint-1
    title: "Checkpoint 1"
    steps:
      - { id: "3.6", title: "Checkpoint 1: two exercises", type: practice, file: checkpoint-1/3.6-exercises.html, checks: [exercise-1-add-button, exercise-2-priority-colors] }
  - id: part-d
    title: "Part D: States and interaction"
    steps:
      - { id: "4.1", title: Hover, focus and active, type: do, file: part-d/4.1-states.html, checks: [states-tab, states-group] }
      - { id: "4.2", title: Focus rings and disabled buttons, type: do, file: part-d/4.2-focus-disabled.html, checks: [focus-input, disabled-add] }
      - { id: "4.3", title: group and peer, type: do, file: part-d/4.3-group-peer.html, checks: [peer-checkbox, peer-title, group-row] }
  - id: part-e
    title: "Part E: Responsive and dark mode"
    steps:
      - { id: "5.1", title: "Mobile first: breakpoints", type: do, file: part-e/5.1-breakpoints.html, checks: [responsive-app] }
      - { id: "5.2", title: Narrow screens, type: do, file: part-e/5.2-narrow.html, checks: [narrow-layout, narrow-groups] }
      - { id: "5.3", title: Dark mode, type: do, file: part-e/5.3-dark.html, checks: [dark-app, dark-row] }
  - id: checkpoint-2
    title: "Checkpoint 2"
    steps:
      - { id: "5.4", title: "Checkpoint 2: two exercises", type: practice, file: checkpoint-2/5.4-exercises.html, checks: [exercise-3-done-row, exercise-4-task-columns] }
  - id: part-f
    title: "Part F: Organize"
    steps:
      - { id: "6.1", title: Keep long class lists tidy, type: read, file: part-f/6.1-organize.html }
      - { id: "6.2", title: Final check, type: check, file: part-f/6.2-final-check.html, checks: [final-build, final-variants, final-no-inline-style] }

checks:
  vite-wired:
    title: "vite.config.js loads and uses the Tailwind plugin"
    type: file
    path: client/vite.config.js
    zones: { s1-2-vite-import: filled, s1-2-vite-plugin: filled }
    contains: ["@tailwindcss/vite", "tailwindcss()"]
    hint: "Write the classes between the two @tutorial comments named s1-2-vite-import and s1-2-vite-plugin in vite.config.js, and save the file."
  css-imported:
    title: "index.css imports Tailwind"
    type: file
    path: client/src/index.css
    zones: { s1-3-css-import: filled }
    matches: ["@import\\s+['\"]tailwindcss['\"]"]
    hint: "Write the classes between the two @tutorial comments named s1-3-css-import in index.css, and save the file."
  title-classes:
    title: "The heading has Tailwind classes"
    type: file
    path: client/src/App.jsx
    zones: { s1-4-title: filled }
    contains: ["text-2xl", "font-bold"]
    hint: "Write the classes between the two @tutorial comments named s1-4-title in App.jsx, and save the file."
  spacing-app:
    title: "App.jsx has page spacing"
    type: file
    path: client/src/App.jsx
    zones: { s2-1-page-spacing: filled }
    contains: ["p-3"]
    hint: "Write the classes between the two @tutorial comments named s2-1-page-spacing in App.jsx, and save the file."
  spacing-row:
    title: "TaskItem.jsx has row spacing"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s2-1-row-spacing: filled }
    contains: ["p-3", "mb-2"]
    hint: "Write the classes between the two @tutorial comments named s2-1-row-spacing in TaskItem.jsx, and save the file."
  spacing-form:
    title: "TaskForm.jsx has form spacing"
    type: file
    path: client/src/components/TaskForm.jsx
    zones: { s2-1-form-spacing: filled }
    contains: ["mb-4"]
    hint: "Write the classes between the two @tutorial comments named s2-1-form-spacing in TaskForm.jsx, and save the file."
  flex-app:
    title: "App.jsx has the header and nav as flex"
    type: file
    path: client/src/App.jsx
    zones: { s2-2-header-flex: filled, s2-2-nav-flex: filled }
    contains: ["flex"]
    hint: "Write the classes between the two @tutorial comments named s2-2-header-flex and s2-2-nav-flex in App.jsx, and save the file."
  flex-row:
    title: "TaskItem.jsx has the row as flex"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s2-2-row-flex: filled }
    contains: ["flex", "gap-3"]
    hint: "Write the classes between the two @tutorial comments named s2-2-row-flex in TaskItem.jsx, and save the file."
  flex-form:
    title: "TaskForm.jsx has the form as flex"
    type: file
    path: client/src/components/TaskForm.jsx
    zones: { s2-2-form-flex: filled }
    contains: ["flex", "gap-2"]
    hint: "Write the classes between the two @tutorial comments named s2-2-form-flex in TaskForm.jsx, and save the file."
  flex-groups:
    title: "GroupFilter.jsx and SortBar.jsx use flex"
    type: file
    path: client/src/components/GroupFilter.jsx
    zones: { s2-2-groups-flex: filled }
    contains: ["flex", "gap-2"]
    hint: "Write the classes between the two @tutorial comments named s2-2-groups-flex in GroupFilter.jsx, and save the file."
  flex-sort:
    title: "SortBar.jsx uses flex"
    type: file
    path: client/src/components/SortBar.jsx
    zones: { s2-2-sort-flex: filled }
    contains: ["flex", "gap-4"]
    hint: "Write the classes between the two @tutorial comments named s2-2-sort-flex in SortBar.jsx, and save the file."
  grid-layout:
    title: "App.jsx has the page layout as a grid"
    type: file
    path: client/src/App.jsx
    zones: { s2-3-layout-grid: filled }
    contains: ["grid ", "grid-cols-"]
    hint: "Write the classes between the two @tutorial comments named s2-3-layout-grid in App.jsx, and save the file."
  container:
    title: "App.jsx centers the page with a maximum width"
    type: file
    path: client/src/App.jsx
    zones: { s2-4-container: filled }
    contains: ["mx-auto", "max-w-"]
    hint: "Write the classes between the two @tutorial comments named s2-4-container in App.jsx, and save the file."
  type-title:
    title: "The heading has type classes"
    type: file
    path: client/src/App.jsx
    zones: { s3-1-title-type: filled }
    contains: ["tracking-tight", "text-slate-900"]
    hint: "Write the classes between the two @tutorial comments named s3-1-title-type in App.jsx, and save the file."
  type-row:
    title: "TaskItem.jsx has type classes"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s3-1-title-weight: filled, s3-1-due-type: filled }
    contains: ["font-medium", "text-sm"]
    hint: "Write the classes between the two @tutorial comments named s3-1-title-weight and s3-1-due-type in TaskItem.jsx, and save the file."
  surface-app:
    title: "App.jsx has a page background"
    type: file
    path: client/src/App.jsx
    zones: { s3-2-page-bg: filled }
    contains: ["bg-slate-50"]
    hint: "Write the classes between the two @tutorial comments named s3-2-page-bg in App.jsx, and save the file."
  surface-row:
    title: "TaskItem.jsx has the task card"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s3-2-row-card: filled }
    contains: ["rounded-lg", "border", "shadow-sm"]
    hint: "Write the classes between the two @tutorial comments named s3-2-row-card in TaskItem.jsx, and save the file."
  surface-history:
    title: "HistoryView.jsx has the history rows"
    type: file
    path: client/src/components/HistoryView.jsx
    zones: { s3-2-history-row: filled }
    contains: ["rounded", "border"]
    hint: "Write the classes between the two @tutorial comments named s3-2-history-row in HistoryView.jsx, and save the file."
  buttons-tab:
    title: "App.jsx has styled tab buttons"
    type: file
    path: client/src/App.jsx
    zones: { s3-3-tab-base: filled }
    contains: ["rounded", "border", "px-3"]
    hint: "Write the classes between the two @tutorial comments named s3-3-tab-base in App.jsx, and save the file."
  buttons-group:
    title: "GroupFilter.jsx has styled group buttons"
    type: file
    path: client/src/components/GroupFilter.jsx
    zones: { s3-3-group-base: filled }
    contains: ["rounded", "border", "px-3"]
    hint: "Write the classes between the two @tutorial comments named s3-3-group-base in GroupFilter.jsx, and save the file."
  buttons-input:
    title: "TaskForm.jsx has a styled title field"
    type: file
    path: client/src/components/TaskForm.jsx
    zones: { s3-3-input-base: filled }
    contains: ["rounded", "border", "px-2"]
    hint: "Write the classes between the two @tutorial comments named s3-3-input-base in TaskForm.jsx, and save the file."
  theme-css:
    title: "index.css defines the brand colors with @theme"
    type: file
    path: client/src/index.css
    zones: { s3-4-theme: filled }
    contains: ["@theme", "--color-brand-"]
    hint: "Write the classes between the two @tutorial comments named s3-4-theme in index.css, and save the file."
  theme-title:
    title: "The heading uses a brand color"
    type: file
    path: client/src/App.jsx
    zones: { s3-4-title-brand: filled }
    contains: ["text-brand-"]
    hint: "Write the classes between the two @tutorial comments named s3-4-title-brand in App.jsx, and save the file."
  badge-group:
    title: "TaskItem.jsx has the group badge"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s3-5-group-badge: filled }
    contains: ["rounded-full", "text-xs"]
    hint: "Write the classes between the two @tutorial comments named s3-5-group-badge in TaskItem.jsx, and save the file."
  badge-priority:
    title: "TaskItem.jsx has the priority badge"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s3-5-priority-base: filled }
    contains: ["text-xs", "uppercase"]
    hint: "Write the classes between the two @tutorial comments named s3-5-priority-base in TaskItem.jsx, and save the file."
  exercise-1-add-button:
    title: "The Add button has a primary look"
    type: file
    path: client/src/components/TaskForm.jsx
    zones: { exercise-1-add-button: filled }
    contains: ["text-white", "rounded"]
    matches: ["bg-\\S+"]
    hint: "Write the classes between the two @tutorial comments named exercise-1-add-button in TaskForm.jsx, and save the file."
  exercise-2-priority-colors:
    title: "The priority badges have three colors"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { exercise-2-priority-colors: filled }
    contains: ["bg-red", "bg-yellow", "bg-green"]
    hint: "Write the classes between the two @tutorial comments named exercise-2-priority-colors in TaskItem.jsx, and save the file."
  states-tab:
    title: "The tab buttons have hover, focus and active states"
    type: file
    path: client/src/App.jsx
    zones: { s4-1-tab-states: filled }
    contains: ["hover:", "focus-visible:", "active:"]
    hint: "Write the classes between the two @tutorial comments named s4-1-tab-states in App.jsx, and save the file."
  states-group:
    title: "The group buttons have hover, focus and active states"
    type: file
    path: client/src/components/GroupFilter.jsx
    zones: { s4-1-group-states: filled }
    contains: ["hover:", "focus-visible:", "active:"]
    hint: "Write the classes between the two @tutorial comments named s4-1-group-states in GroupFilter.jsx, and save the file."
  focus-input:
    title: "The title field has a focus ring"
    type: file
    path: client/src/components/TaskForm.jsx
    zones: { s4-2-input-focus: filled }
    contains: ["focus:ring"]
    hint: "Write the classes between the two @tutorial comments named s4-2-input-focus in TaskForm.jsx, and save the file."
  disabled-add:
    title: "The Add button has a disabled style"
    type: file
    path: client/src/components/TaskForm.jsx
    zones: { s4-2-add-disabled: filled }
    contains: ["disabled:"]
    hint: "Write the classes between the two @tutorial comments named s4-2-add-disabled in TaskForm.jsx, and save the file."
  peer-checkbox:
    title: "The checkbox is a peer"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s4-3-checkbox: filled }
    contains: ["peer"]
    hint: "Write the classes between the two @tutorial comments named s4-3-checkbox in TaskItem.jsx, and save the file."
  peer-title:
    title: "The title reacts to the checkbox with peer-checked"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s4-3-title-peer: filled }
    contains: ["peer-checked:"]
    hint: "Write the classes between the two @tutorial comments named s4-3-title-peer in TaskItem.jsx, and save the file."
  group-row:
    title: "The row is a group and the Delete button shows on hover"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s4-3-row-group: filled, s4-3-delete-hover: filled }
    contains: ["group", "group-hover:"]
    hint: "Write the classes between the two @tutorial comments named s4-3-row-group and s4-3-delete-hover in TaskItem.jsx, and save the file."
  responsive-app:
    title: "App.jsx grows its spacing and title from sm"
    type: file
    path: client/src/App.jsx
    zones: { s5-1-page-sm: filled, s5-1-title-sm: filled }
    contains: ["sm:p-", "sm:text-"]
    hint: "Write the classes between the two @tutorial comments named s5-1-page-sm and s5-1-title-sm in App.jsx, and save the file."
  narrow-layout:
    title: "The layout becomes one column on narrow screens"
    type: file
    path: client/src/App.jsx
    zones: { s5-2-layout-narrow: filled }
    contains: ["max-md:"]
    hint: "Write the classes between the two @tutorial comments named s5-2-layout-narrow in App.jsx, and save the file."
  narrow-groups:
    title: "The group buttons become a column from md"
    type: file
    path: client/src/components/GroupFilter.jsx
    zones: { s5-2-groups-narrow: filled }
    contains: ["md:"]
    hint: "Write the classes between the two @tutorial comments named s5-2-groups-narrow in GroupFilter.jsx, and save the file."
  dark-app:
    title: "App.jsx has dark mode classes"
    type: file
    path: client/src/App.jsx
    zones: { s5-3-dark-page: filled, s5-3-dark-title: filled }
    contains: ["dark:bg-", "dark:text-"]
    hint: "Write the classes between the two @tutorial comments named s5-3-dark-page and s5-3-dark-title in App.jsx, and save the file."
  dark-row:
    title: "TaskItem.jsx has dark mode classes"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { s5-3-dark-row: filled }
    contains: ["dark:bg-", "dark:border-"]
    hint: "Write the classes between the two @tutorial comments named s5-3-dark-row in TaskItem.jsx, and save the file."
  exercise-3-done-row:
    title: "A done task is faded and a row lights up on hover"
    type: file
    path: client/src/components/TaskItem.jsx
    zones: { exercise-3-done-row: filled }
    contains: ["task.done", "opacity-", "hover:bg-"]
    hint: "Write the classes between the two @tutorial comments named exercise-3-done-row in TaskItem.jsx, and save the file."
  exercise-4-task-columns:
    title: "The task list has one column on mobile and two from md"
    type: file
    path: client/src/components/TaskList.jsx
    zones: { exercise-4-task-columns: filled }
    contains: ["md:grid-cols-2", "grid"]
    hint: "Write the classes between the two @tutorial comments named exercise-4-task-columns in TaskList.jsx, and save the file."
  title-build:
    title: The page builds and Tailwind made the CSS for your classes
    type: test
    cwd: client
    timeoutMs: 90000
    command: ["sh", "-c", "./node_modules/.bin/vite build --logLevel error && grep -q 'font-bold' dist/assets/*.css"]
    hint: "Steps 1.2 and 1.3 must be done first (the plugin and the import), then the classes of step 1.4."
  final-build:
    title: The project builds without errors
    type: test
    cwd: client
    timeoutMs: 90000
    command: ["./node_modules/.bin/vite", "build", "--logLevel", "error"]
    hint: "Run ./node_modules/.bin/vite build in the folder client to see the error."
  final-variants:
    title: The classes use hover, a breakpoint and dark mode
    type: test
    cwd: client
    command: ["sh", "-c", "grep -rqE 'hover:' src && grep -rqE '(sm|md|lg):' src && grep -rq 'dark:' src"]
    hint: "Parts D and E teach hover:, sm: / md: and dark:. At least one of each must be in your classes."
  final-no-inline-style:
    title: There are no inline style attributes
    type: test
    cwd: client
    command: ["sh", "-c", "! grep -rq 'style=' src"]
    hint: "Replace every style=... with Tailwind classes."
