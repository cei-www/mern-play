    hint: "Write the component between the two @tutorial comments of exercise 6."
  exercise-7-group-stats:
    title: GET /api/stats/group/:id returns the totals of a group
    type: flow
    steps:
      - type: sql
        database: taskapp
        query: "SELECT g.name AS name, COUNT(t.id) AS total, CAST(COALESCE(SUM(t.done), 0) AS UNSIGNED) AS done FROM task_groups g LEFT JOIN tasks t ON t.group_id = g.id WHERE g.id = 1 GROUP BY g.id"
        save: { name: "$.rows[0].name", total: "$.rows[0].total", done: "$.rows[0].done" }
      - type: http
        request: { method: GET, url: "http://localhost:3000/api/stats/group/1" }
        expect: { status: 200, json: { name: { $var: name }, total: { $var: total }, done: { $var: done } } }
        hints:
          404: "No route answers /api/stats/group/1. Fill exercise 7 in server/routes/stats.js."
      - type: http
        request: { method: GET, url: "http://localhost:3000/api/stats/group/999999" }
        expect: { status: 404, json: { error: "Group not found" } }
